# Edge functions that are reached WITHOUT a Supabase JWT must opt out of the
# gateway's default JWT verification, or every request is rejected 401 before the
# function body (and its own auth) ever runs.
#
#   • stripe-webhook        — Stripe POSTs, authenticated by the stripe-signature
#                             header (verified in-function), never a Supabase JWT.
#   • stripe-identity-return / stripe-connect-return — browser landing pages the
#                             user is redirected to after the hosted Stripe flow.
#
# Every OTHER function is called by the app WITH a JWT and additionally calls
# supabase.auth.getUser(token) itself, so it keeps the default verify_jwt = true.

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-identity-return]
verify_jwt = false

[functions.stripe-connect-return]
verify_jwt = false

# support-submit — public website Contact form (no JWT), so the gateway JWT check
#   must be off; the function has no per-user auth.
[functions.support-submit]
verify_jwt = false

# support-reply / support-ai-draft are intentionally NOT listed here. The admin
#   console calls them with the signed-in admin's Supabase USER JWT (see
#   admin/app/(console)/support/actions.ts callEdge — Authorization: Bearer
#   <admin session token>), and each function validates that token + AAL2/MFA +
#   the admin_users ROLE tier in-function, via requireAdminCaller() in
#   _shared/adminAuth.ts. (It used to check membership only, which let a
#   support-tier token do admin-tier work by calling the function directly.)
#   Tiers: support-reply/support-ai-draft = 'support' for ticket-queue work;
#   support-reply's no-ticket branch and send-push's adminNotice = 'admin'.
#   Like every other JWT-authenticated function they keep the default
#   verify_jwt = true, so the gateway also rejects any unauthenticated request
#   before the function runs. (There is no x-admin-secret / service-role-header
#   mechanism — that never existed.)

# safety-alert — invoked by the reports AFTER INSERT trigger via pg_net with the
#   x-safety-secret shared secret (SAFETY_ALERT_SECRET), never a user JWT, so the
#   gateway JWT check must be off; the function verifies the secret itself.
[functions.safety-alert]
verify_jwt = false

# controls-alert — invoked by pg_cron via pg_net with the x-controls-secret shared
# secret from app_flags.controls_alert, never a user JWT. Without this line the next
# plain `supabase functions deploy` re-enables JWT verification and silently kills the
# alerting channel — and the control below would be the only thing that ever noticed.
[functions.controls-alert]
verify_jwt = false

# reconcile-stripe — same dispatch path, same shared secret, same reason.
[functions.reconcile-stripe]
verify_jwt = false


# waitlist-submit — the public waitlist form on gohustlr.com posts here, and the
#   confirm/unsubscribe links in the confirmation email are clicked straight from an
#   inbox with no session in existence. There is nothing for the gateway to verify.
#   The function's own auth is (a) its per-IP and global caps, (b) the fact that a
#   caller can only add their own address, and (c) a 256-bit token for the two
#   destructive ops. Without this line the next plain `supabase functions deploy`
#   turns JWT verification back on and every confirm and unsubscribe link on the
#   internet starts returning 401 — including the one legal obligation in the file.
[functions.waitlist-submit]
verify_jwt = false

# settle-disputes — dispatched by controls_sweep_and_page over pg_net with the
#   x-controls-secret shared secret from app_flags.controls_alert, never by a user. It is
#   the ONLY thing that pays a dispute now that a poster's reduction is a proposal, so a
#   gateway 401 here does not degrade a feature — it strands held escrow until the Stripe
#   authorization lapses at about seven days, after which nobody can be paid.
#   ctl_dispute_settlement_overdue is registered CRITICAL for exactly that reason.
[functions.settle-disputes]
verify_jwt = false
